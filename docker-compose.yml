version: "3.9"

services: 
  api:
    build: "./docker"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    env_file:
      - .env
  
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: e_commerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: 
      - "5432:5432"
    redis: 
      image: redis:7
      ports:
        - "6379:6379"